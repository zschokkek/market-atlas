<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Explore live temperature, precipitation, severe weather, and climate Kalshi markets on an interactive globe.">
  <meta name="theme-color" content="#0b0f12">
  <meta name="color-scheme" content="dark">
  <title>Market Atlas · Weather</title>
  <link rel="stylesheet" href="../politics/styles.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/assets/globe-shell.css">
</head>
<body>
  <main class="politics-app weather-app market-globe-shell" aria-label="Weather market globe">
    <header class="app-header">
      <div class="powered-by-kalshi" aria-label="Powered by Kalshi">
        <span class="powered-label">Powered by</span>
        <span class="kalshi-lockup"><svg class="kalshi-mark" viewBox="0 0 34 34" aria-label="Kalshi"><rect x="1" y="1" width="32" height="32" rx="9" fill="#0ac285"></rect><path d="M9 8.5h5v6.4l6.15-6.4h6.35l-7.45 7.55L27 25.5h-6.4l-5.05-6.1L14 21v4.5H9z" fill="#07120d"></path></svg><span class="kalshi-wordmark">KALSHI</span></span>
      </div>
      <nav class="market-tabs" aria-label="Market category"><button class="market-tab" type="button">Sports</button><button class="market-tab" type="button">Politics</button><button class="market-tab is-active" type="button" aria-current="page">Weather</button></nav>
      <label class="market-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.75"></circle><path d="m16 16 4 4"></path></svg><span class="sr-only">Search</span><input type="search" aria-label="Search weather markets and locations" placeholder="Search weather markets" readonly><kbd>&#8984; K</kbd></label>
    </header>

    <div class="feed-status-strip"><span class="feed-status-orb"></span><span class="feed-status-label">Connecting live weather markets</span><span class="feed-status-note">Warming cached Kalshi feed</span></div>

    <div class="politics-layout weather-layout market-globe-layout">
      <aside class="filter-sidebar orbital-panel market-filter-panel" aria-label="Weather map filters">
        <fieldset><legend><span class="panel-heading"><span class="panel-orb"></span>Market type</span></legend>
          <div class="check-list weather-kind-list">
            <label class="check-option"><input type="checkbox" data-kind="Temperature" checked><span>Temperature</span><small>Daily & hourly</small></label>
            <label class="check-option"><input type="checkbox" data-kind="Rain & Snow" checked><span>Rain & snow</span><small>City forecasts</small></label>
            <label class="check-option"><input type="checkbox" data-kind="Hurricanes" checked><span>Hurricanes</span><small>Season & storms</small></label>
            <label class="check-option"><input type="checkbox" data-kind="Natural Disasters" checked><span>Natural disasters</span><small>Quakes & severe weather</small></label>
            <label class="check-option"><input type="checkbox" data-kind="Climate Change" checked><span>Climate change</span><small>Long-range markets</small></label>
          </div>
        </fieldset>
        <div class="filter-summary" aria-live="polite"><span class="filter-summary-number">0</span><span class="filter-summary-copy">locations visible</span></div>
      </aside>

      <section class="globe-stage market-globe-stage" aria-label="Weather market map">
        <div class="globe-hud"><span class="hud-summary">Loading weather markets</span></div>
        <svg class="politics-globe weather-globe market-globe" viewBox="0 0 620 560" role="img" aria-label="Weather market globe">
          <defs><radialGradient id="weather-ocean-gradient" cx="34%" cy="28%" r="72%"><stop class="ocean-light" offset="0%"></stop><stop class="ocean-dark" offset="100%"></stop></radialGradient><clipPath id="weather-sphere-clip"><path class="sphere-clip-path"></path></clipPath></defs>
          <path class="globe-shadow"></path><path class="globe-ocean"></path>
          <g clip-path="url(#weather-sphere-clip)"><path class="globe-graticule"></path><g class="countries-layer"></g><g class="states-layer"></g><g class="capital-labels-layer"></g></g>
          <g class="markers-layer"></g>
        </svg>
        <div class="map-tooltip weather-tooltip" role="tooltip" hidden></div>
        <div class="zoom-controls" aria-label="Globe zoom controls"><button type="button" class="zoom-button market-zoom-button zoom-in" aria-label="Zoom in">+</button><button type="button" class="zoom-button market-zoom-button zoom-out" aria-label="Zoom out">−</button></div>
        <div class="globe-hint">Drag to rotate · scroll to zoom · hover for prices</div>
      </section>

      <aside class="election-detail weather-detail orbital-panel market-detail-panel" aria-live="polite">
        <div class="mobile-sheet-handle" aria-hidden="true"></div>
        <button class="mobile-market-sheet-close" type="button" aria-label="Close market details">&#215;</button>
        <div class="detail-heading-row"><div><span class="detail-kicker"><span class="panel-orb"></span>Weather market</span><h1 class="detail-jurisdiction">Select a location</h1></div><span class="detail-code">—</span></div>
        <div class="detail-location">Hover or click a marker to inspect its markets.</div><div class="detail-meta"></div><div class="detail-market-list"></div>
      </aside>

      <section class="timeline-dock orbital-panel market-timeline-dock" aria-label="Weather market horizon">
        <div class="timeline-header"><div class="timeline-kicker"><span class="timeline-orb"></span><span>Market horizon</span></div><div class="timeline-readout"><span class="timeline-eyebrow">Weather window</span><output class="timeline-label"></output></div><span class="timeline-activity"></span></div>
        <div class="timeline-controls"><button class="timeline-step timeline-prev" type="button" aria-label="Previous horizon">&#8249;</button><div class="timeline-range-wrap"><input class="timeline-range" type="range" min="0" value="0" step="1" aria-label="Weather horizon"><div class="timeline-stops" aria-hidden="true"></div></div><button class="timeline-step timeline-next" type="button" aria-label="Next horizon">&#8250;</button></div>
      </section>
    </div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
