"$schema" = "./node_modules/wrangler/config-schema.json"
name = "market-atlas"
main = "src/worker.js"
compatibility_date = "2026-08-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "REFRESH_COORDINATOR"
class_name = "RefreshCoordinator"

[exports.RefreshCoordinator]
type = "durable-object"
storage = "sqlite"

# The top-level configuration is for local Wrangler development only. Hosted
# releases must always specify either --env staging or --env production.
[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "MARKET_ATLAS_CACHE"
id = "REPLACE_WITH_LOCAL_KV_ID"
preview_id = "REPLACE_WITH_LOCAL_PREVIEW_KV_ID"

[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "local"
KALSHI_UNAUTHENTICATED_READ_TOKENS_PER_SECOND = "20"
KALSHI_UNAUTHENTICATED_GAME_READ_REQUESTS_PER_SECOND = "1.5"
KALSHI_FUTURES_READ_REQUESTS_PER_SECOND = "0.5"
KALSHI_WEATHER_READ_REQUESTS_PER_SECOND = "1.25"
KALSHI_POLITICS_READ_REQUESTS_PER_SECOND = "1.25"
KALSHI_READ_REQUEST_COST = "10"
KALSHI_RATE_BUDGET_FRACTION = "0.25"
KALSHI_MAX_READ_REQUESTS_PER_SECOND = "10"
KALSHI_POLL_CONCURRENCY = "4"
KALSHI_MAX_EVENT_REFRESHES_PER_RUN = "40"
KALSHI_MAX_WEATHER_REFRESHES_PER_RUN = "30"
KALSHI_MAX_POLITICS_REFRESHES_PER_RUN = "12"
KALSHI_MAX_BUSINESS_REFRESHES_PER_RUN = "20"
KALSHI_MAX_RETRY_ATTEMPTS = "2"
KALSHI_429_BACKOFF_BASE_MS = "5000"

# Staging gets its own Worker, KV namespace, secrets, cache, and reduced polling
# budget so validation traffic cannot consume the production read allowance.
[env.staging]
name = "market-atlas-staging"
workers_dev = true

[env.staging.assets]
directory = "./public"
binding = "ASSETS"

[[env.staging.durable_objects.bindings]]
name = "REFRESH_COORDINATOR"
class_name = "RefreshCoordinator"

[[env.staging.kv_namespaces]]
binding = "MARKET_ATLAS_CACHE"
id = "cf35815b663142cfbfe6fadf007b14e2"
preview_id = "8225b89be2234ffcbbac7bb650e2fd66"

[env.staging.triggers]
crons = ["*/5 * * * *"]

[env.staging.vars]
ENVIRONMENT = "staging"
KALSHI_UNAUTHENTICATED_READ_TOKENS_PER_SECOND = "20"
KALSHI_UNAUTHENTICATED_GAME_READ_REQUESTS_PER_SECOND = "1.0"
KALSHI_FUTURES_READ_REQUESTS_PER_SECOND = "0.25"
KALSHI_WEATHER_READ_REQUESTS_PER_SECOND = "0.5"
KALSHI_POLITICS_READ_REQUESTS_PER_SECOND = "0.5"
KALSHI_READ_REQUEST_COST = "10"
KALSHI_RATE_BUDGET_FRACTION = "0.10"
KALSHI_MAX_READ_REQUESTS_PER_SECOND = "5"
KALSHI_POLL_CONCURRENCY = "2"
KALSHI_MAX_EVENT_REFRESHES_PER_RUN = "20"
KALSHI_MAX_WEATHER_REFRESHES_PER_RUN = "15"
KALSHI_MAX_POLITICS_REFRESHES_PER_RUN = "8"
KALSHI_MAX_BUSINESS_REFRESHES_PER_RUN = "10"
KALSHI_SCHEDULED_READ_REQUESTS_PER_SECOND = "0.20"
KALSHI_MAX_RETRY_ATTEMPTS = "2"
KALSHI_429_BACKOFF_BASE_MS = "5000"

# Production retains the existing adaptive polling policy and is isolated from
# staging by both its Worker name and KV binding.
[env.production]
name = "market-atlas"
workers_dev = true

[env.production.assets]
directory = "./public"
binding = "ASSETS"

[[env.production.durable_objects.bindings]]
name = "REFRESH_COORDINATOR"
class_name = "RefreshCoordinator"

[[env.production.kv_namespaces]]
binding = "MARKET_ATLAS_CACHE"
id = "a5421008c7454cb1b68a5efed1f2b5ba"
preview_id = "666142a649d749938af378143d3ca8d5"

[env.production.triggers]
crons = ["* * * * *"]

[env.production.vars]
ENVIRONMENT = "production"
KALSHI_UNAUTHENTICATED_READ_TOKENS_PER_SECOND = "20"
KALSHI_UNAUTHENTICATED_GAME_READ_REQUESTS_PER_SECOND = "0.25"
KALSHI_FUTURES_READ_REQUESTS_PER_SECOND = "4"
KALSHI_WEATHER_READ_REQUESTS_PER_SECOND = "4"
KALSHI_POLITICS_READ_REQUESTS_PER_SECOND = "4"
KALSHI_READ_REQUEST_COST = "10"
KALSHI_RATE_BUDGET_FRACTION = "0.20"
KALSHI_MAX_READ_REQUESTS_PER_SECOND = "4"
KALSHI_SCHEDULED_READ_REQUESTS_PER_SECOND = "4"
KALSHI_SCHEDULED_STEPS_PER_RUN = "3"
KALSHI_POLL_CONCURRENCY = "4"
KALSHI_MAX_EVENT_REFRESHES_PER_RUN = "60"
KALSHI_MAX_WEATHER_REFRESHES_PER_RUN = "40"
KALSHI_MAX_POLITICS_REFRESHES_PER_RUN = "20"
KALSHI_MAX_BUSINESS_REFRESHES_PER_RUN = "30"
KALSHI_MAX_RETRY_ATTEMPTS = "2"
KALSHI_429_BACKOFF_BASE_MS = "5000"
