  function placeMarkers() {
    leadersLayer.replaceChildren();
    const visible = markerNodes.filter(node =&gt; isVisible(node.event)).map((node, index) =&gt; {

      return { ...node, index, anchorX: anchor[0], anchorY: anchor[1], x: anchor[0], y: anchor[1] };

    const minDistance = 42;

        for (let b = a + 1; b &lt; visible.length; b += 1) {
          const left = visible[a];

          let dx = right.x - left.x;
          let dy = right.y - left.y;
          let distance = Math.hypot(dx, dy);
          if (distance &lt; minDistance) {
            if (distance &lt; 0.01) {

              dy = Math.sin((a + 1) * 1.9);
              distance = 1;

            const force = (minDistance - distance) * 0.23;
            left.x -= (dx / distance) * force;
            left.y -= (dy / distance) * force;
            right.x += (dx / distance) * force;
            right.y += (dy / distance) * force;

      button.title = `Bid ${priceLabel(bid)} · Ask ${priceLabel(ask)}`;
      button.addEventListener(&quot;click&quot;, () =&gt; {
        list.querySelectorAll(&quot;.price-row&quot;).forEach(row =&gt; row.classList.remove(&quot;is-selected&quot;));
        button.classList.add(&quot;is-selected&quot;);
        selectedTicker = ticker;
        root.querySelector(&quot;.contract-ticker&quot;).textContent = ticker;
        marketLink.href = marketUrl(ticker);
      });
      list.appendChild(button);
    });
  }

  function selectEvent(id, rotateToEvent = false) {
    const event = events.find(item =&gt; item.id === id);
    if (!event) return;
    selectedId = event.id;
    selectedTicker = event.prices[0][4];
    eventSelect.value = event.id;
    markerNodes.forEach(node =&gt; node.group.classList.toggle(&quot;is-selected&quot;, node.event.id === selectedId));
    detail.dataset.sport = event.sport;
    root.querySelector(&quot;.sport-badge&quot;).textContent = event.sport;
    root.querySelector(&quot;.event-dates&quot;).textContent = event.dates;
    root.querySelector(&quot;.event-name&quot;).textContent = event.name;
    root.querySelector(&quot;.event-location&quot;).textContent = `${event.venue} · ${event.city}`;
    root.querySelector(&quot;.event-ticker&quot;).textContent = event.eventTicker;
    root.querySelector(&quot;.contract-count&quot;).textContent = `${event.contracts} contracts`;
    root.querySelector(&quot;.market-meta&quot;).textContent = `${formatVolume(event.volume)} · snapshot Jul 31, 6:18 PM ET`;
    root.querySelector(&quot;.contract-ticker&quot;).textContent = selectedTicker;
    marketLink.href = marketUrl(selectedTicker);
    renderPriceList(event);

    if (rotateToEvent) {
      projection.rotate([-event.lon, -event.lat, 0]);
      draw();
    }
  }

  function renderFilter(sport) {
    activeSport = sport;
    root.querySelectorAll(&quot;.filter-button&quot;).forEach(button =&gt; button.classList.toggle(&quot;is-active&quot;, button.dataset.sport === activeSport));
    const filtered = visibleEvents();
    root.querySelector(&quot;.hud-summary&quot;).textContent = `${filtered.length} posted ${activeSport === &quot;ALL&quot; ? &quot;events&quot; : activeSport + &quot; events&quot;}`;
    eventSelect.replaceChildren();
    filtered.forEach(event =&gt; {
      const option = document.createElement(&quot;option&quot;);
      option.value = event.id;
      option.textContent = `${event.dates} — ${event.name}`;
      eventSelect.appendChild(option);
    });
    if (!filtered.some(event =&gt; event.id === selectedId)) selectedId = filtered[0].id;
    buildMarkers();
    draw();
    selectEvent(selectedId, false);
  }

  function showTooltip(event, group) {
    tooltip.innerHTML = `&lt;strong&gt;${event.sport} · ${event.name}&lt;/strong&gt;&lt;br&gt;${event.city} · leader ${priceLabel(event.leader)}`;
    tooltip.hidden = false;
    requestAnimationFrame(() =&gt; {
      const transform = group.transform.baseVal.consolidate();
      if (!transform) return;
      const point = svg.createSVGPoint();
      point.x = transform.matrix.e;
      point.y = transform.matrix.f;
      const screen = point.matrixTransform(svg.getScreenCTM());
      const stageRect = root.querySelector(&quot;.globe-stage&quot;).getBoundingClientRect();
      const box = tooltip.getBoundingClientRect();
      const idealLeft = screen.x - stageRect.left - box.width / 2;
      tooltip.style.left = `${Math.max(4, Math.min(stageRect.width - box.width - 4, idealLeft))}px`;
      tooltip.style.top = `${Math.max(4, screen.y - stageRect.top - box.height - 18)}px`;
    });
  }

  function hideTooltip() {
    tooltip.hidden = true;
  }

  let dragging = false;
  let dragStart = null;
  let startRotation = null;
  svg.addEventListener(&quot;pointerdown&quot;, event =&gt; {
    dragging = true;
    dragStart = [event.clientX, event.clientY];
    startRotation = projection.rotate();
    svg.classList.add(&quot;is-dragging&quot;);
    svg.setPointerCapture(event.pointerId);
    hideTooltip();
  });
  svg.addEventListener(&quot;pointermove&quot;, event =&gt; {
    if (!dragging) return;
    projection.rotate([
      startRotation[0] + (event.clientX - dragStart[0]) * 0.28,
      Math.max(-75, Math.min(75, startRotation[1] - (event.clientY - dragStart[1]) * 0.28)),
      0
    ]);
    draw();
  });
  function endDrag(event) {
    if (!dragging) return;
    dragging = false;
    svg.classList.remove(&quot;is-dragging&quot;);
    if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
  }
  svg.addEventListener(&quot;pointerup&quot;, endDrag);
  svg.addEventListener(&quot;pointercancel&quot;, endDrag);

  root.querySelectorAll(&quot;.filter-button&quot;).forEach(button =&gt; button.addEventListener(&quot;click&quot;, () =&gt; renderFilter(button.dataset.sport)));
  eventSelect.addEventListener(&quot;change&quot;, event =&gt; selectEvent(event.target.value, true));
  root.querySelector(&quot;.refresh-markets&quot;).addEventListener(&quot;click&quot;, async () =&gt; {
    if (window.openai?.sendFollowUpMessage) {
      await window.openai.sendFollowUpMessage({
        title: &quot;Refresh ATP, WTA &amp; PGA odds&quot;,
        prompt: &quot;Refresh all currently open Kalshi ATP, WTA, and PGA tournament-winner markets. Resolve each posted event to its official dates and venue, then update this globe while preserving the ticker, location, price bars, filters, and visual design.&quot;
      });
    }
  });

      id: &quot;crk-wi-pakistan&quot;, sport: &quot;CRK&quot;, code: &quot;CRK&quot;, name: &quot;West Indies vs Pakistan · 2nd Test&quot;, eventTicker: &quot;KXTESTMATCH-26AUG021000PAKWI&quot;,
      start: &quot;2026-08-02&quot;, end: &quot;2026-08-06&quot;, dates: &quot;Aug 2 – 6&quot;, venue: &quot;Queen’s Park Oval&quot;, city: &quot;Port of Spain, Trinidad and Tobago&quot;, lat: 10.667411, lon: -61.5237463,
      contracts: 3, volume: 361, prices: [[&quot;West Indies&quot;,44,43,44,&quot;KXTESTMATCH-26AUG021000PAKWI-WI&quot;],[&quot;Pakistan&quot;,33,30,34,&quot;KXTESTMATCH-26AUG021000PAKWI-PAK&quot;],[&quot;Draw / Tie&quot;,24,20,26,&quot;KXTESTMATCH-26AUG021000PAKWI-TIE&quot;]]
    }
  ];

  const svg = root.querySelector(&quot;.sports-globe&quot;);
  const ns = &quot;http://www.w3.org/2000/svg&quot;;
  const center = [310, 270];
  const projection = geoOrthographic().translate(center).scale(248).clipAngle(90).precision(0.4).rotate([98, -38, 0]);
  const path = geoPath(projection);
  const sphere = { type: &quot;Sphere&quot; };
  const graticule = geoGraticule10();
  const countries = feature(world, world.objects.features).features;
  const states = feature(us, us.objects.states).features;
  const dateRange = root.querySelector(&quot;#global-zoom-date-range&quot;);
  const dateOutput = root.querySelector(&quot;#global-zoom-date-output&quot;);
  const eventSelect = root.querySelector(&quot;#global-zoom-event-select&quot;);
  const tooltip = root.querySelector(&quot;.map-tooltip&quot;);
  const sphereClipPath = root.querySelector(&quot;.sphere-clip-path&quot;);
  const shadowPath = root.querySelector(&quot;.globe-shadow&quot;);
  const oceanPath = root.querySelector(&quot;.globe-ocean&quot;);
  const graticulePath = root.querySelector(&quot;.globe-graticule&quot;);
  const countriesLayer = root.querySelector(&quot;.countries-layer&quot;);
  const statesLayer = root.querySelector(&quot;.states-layer&quot;);
  const leadersLayer = root.querySelector(&quot;.leaders-layer&quot;);
  const markersLayer = root.querySelector(&quot;.markers-layer&quot;);
  const detail = root.querySelector(&quot;.event-detail&quot;);
  const marketLink = root.querySelector(&quot;.market-link&quot;);
  const sports = [&quot;MLB&quot;, &quot;ATP&quot;, &quot;WTA&quot;, &quot;PGA&quot;, &quot;UCL&quot;, &quot;CRK&quot;];
  const enabledSports = new Set(sports);
  const sportOrder = { MLB: 0, ATP: 1, WTA: 2, PGA: 3, UCL: 4, CRK: 5 };
  const gamesByDate = mlb.dates.map(() =&gt; []);
  mlb.games.forEach(row =&gt; gamesByDate[row[1]].push(row));
  gamesByDate.forEach(rows =&gt; rows.sort((a, b) =&gt; a[2].localeCompare(b[2])));
  dateRange.max = String(mlb.dates.length - 1);

  const dateLabel = new Intl.DateTimeFormat(&quot;en-US&quot;, { timeZone: &quot;America/New_York&quot;, weekday: &quot;short&quot;, month: &quot;short&quot;, day: &quot;numeric&quot; });
  const timeLabel = new Intl.DateTimeFormat(&quot;en-US&quot;, { timeZone: &quot;America/New_York&quot;, hour: &quot;numeric&quot;, minute: &quot;2-digit&quot; });
  const tickerParts = new Intl.DateTimeFormat(&quot;en-US&quot;, { timeZone: &quot;America/New_York&quot;, year: &quot;2-digit&quot;, month: &quot;short&quot;, day: &quot;2-digit&quot;, hour: &quot;2-digit&quot;, minute: &quot;2-digit&quot;, hour12: false });
  let activeDateIndex = 0;
  let activeEvents = [];
  let markerNodes = [];
  let selectedId = null;
  let selectedTicker = null;

  const countryPaths = countries.map(country =&gt; {
    const element = document.createElementNS(ns, &quot;path&quot;);
    element.setAttribute(&quot;class&quot;, &quot;country&quot;);
    countriesLayer.appendChild(element);
    return { element, feature: country };
  });
  const statePaths = states.map(state =&gt; {
    const element = document.createElementNS(ns, &quot;path&quot;);
    element.setAttribute(&quot;class&quot;, &quot;state&quot;);
    statesLayer.appendChild(element);
    return { element, feature: state };
  });

  function mlbTicker(game) {
    const parts = Object.fromEntries(tickerParts.formatToParts(new Date(game.utc)).map(part =&gt; [part.type, part.value]));
    return `KXMLBGAME-${parts.year}${parts.month.toUpperCase()}${parts.day}${parts.hour}${parts.minute}${game.awayKalshi}${game.homeKalshi}`;
  }

  function unpackMlb(row) {
    const away = mlb.teams[row[3]];
    const home = mlb.teams[row[4]];
    const venue = mlb.venues[row[5]];
    const game = {
      id: `mlb-${row[0]}`, sport: &quot;MLB&quot;, code: home[0], utc: row[2], state: row[6], awayScore: row[7], homeScore: row[8],
      awayCode: away[0], awayName: away[1], awayKalshi: away[2], homeCode: home[0], homeName: home[1], homeKalshi: home[2],
      name: `${away[0]} at ${home[0]}`, venue: venue[0], city: `${venue[1]}, ${venue[2]}`, lat: venue[3], lon: venue[4], contracts: 2
    };
    game.eventTicker = mlbTicker(game);
    const market = mlb.markets[game.eventTicker] || null;
    game.marketPosted = Boolean(market);
    game.volume = market ? market[2] : 0;
    game.prices = market ? [[away[1], market[0], null, null, game.eventTicker], [home[1], market[1], null, null, game.eventTicker]] : [];
    game.dates = `${timeLabel.format(new Date(game.utc))} ET`;
    game.status = row[6] === &quot;F&quot; ? `Final · ${away[0]} ${row[7]}–${row[8]}` : row[6] === &quot;L&quot; ? `Live · ${away[0]} ${row[7]}–${row[8]}` : &quot;Upcoming&quot;;
    game.leader = market ? market[1] : 0;
    game.sortKey = row[2];
    return game;
  }

  function activeTourEvents(date) {
    return tourEvents.filter(event =&gt; event.start &lt;= date &amp;&amp; date &lt;= event.end).map(event =&gt; ({
      ...event, marketPosted: true, leader: event.prices[0][1], status: &quot;Tournament market&quot;, sortKey: event.start
    }));
  }

  function priceLabel(value) {
    if (value == null) return &quot;—&quot;;
    return `${Number.isInteger(value) ? value : value.toFixed(1)}%`;
  }

  function formatVolume(value) {
    if (!value) return &quot;Market volume pending&quot;;
    if (value &gt;= 1000000) return `${(value / 1000000).toFixed(value &gt;= 100000000 ? 0 : 1)}M contracts traded`;
    if (value &gt;= 1000) return `${Math.round(value / 1000)}K contracts traded`;
    return `${value.toLocaleString()} contracts traded`;
  }

  function volumeRadius(value) {
    if (!value) return 12;
    const normalized = Math.max(0, Math.min(1, (Math.log10(value + 1) - 2) / 6));
    return 12 + normalized * 9;
  }

  function marketUrl(ticker) {
    return `https://kalshi.com/markets_by_ticker/${ticker.toLowerCase()}`;
  }

  function isVisible(event) {
    return geoDistance(projection.invert(center), [event.lon, event.lat]) &lt; Math.PI / 2;
  }

  function placeMarkers() {
    leadersLayer.replaceChildren();
    const inFrame = markerNodes.filter(node =&gt; isVisible(node.event)).map(node =&gt; {
      const anchor = projection([node.event.lon, node.event.lat]);
      return { ...node, anchorX: anchor[0], anchorY: anchor[1], x: anchor[0], y: anchor[1] };
    }).filter(node =&gt; node.anchorX &gt;= -node.radius &amp;&amp; node.anchorX &lt;= 620 + node.radius &amp;&amp; node.anchorY &gt;= -node.radius &amp;&amp; node.anchorY &lt;= 560 + node.radius)
      .sort((left, right) =&gt; right.event.volume - left.event.volume || Number(right.event.marketPosted) - Number(left.event.marketPosted));
    const visible = inFrame.slice(0, 10);
    const shownIds = new Set(visible.map(node =&gt; node.event.id));
    root.querySelector(&quot;.hud-summary&quot;).textContent = `${visible.length} shown · ${inFrame.length} in frame · ${activeEvents.length} active`;

    for (let step = 0; step &lt; 100; step += 1) {
      for (let a = 0; a &lt; visible.length; a += 1) {
        for (let b = a + 1; b &lt; visible.length; b += 1) {
          const left = visible[a];
          const right = visible[b];
          let dx = right.x - left.x;
          let dy = right.y - left.y;
          let distance = Math.hypot(dx, dy);
          const minDistance = left.radius + right.radius + 8;
          if (distance &lt; minDistance) {
            if (distance &lt; 0.01) {
              dx = Math.cos((a + 1) * 1.9);
              dy = Math.sin((a + 1) * 1.9);
              distance = 1;
            }
            const force = (minDistance - distance) * 0.23;
            left.x -= (dx / distance) * force;
            left.y -= (dy / distance) * force;
            right.x += (dx / distance) * force;
            right.y += (dy / distance) * force;
          }
        }
      }
      visible.forEach(point =&gt; {
        point.x += (point.anchorX - point.x) * 0.035;
        point.y += (point.anchorY - point.y) * 0.035;
      });
    }

    markerNodes.forEach(node =&gt; {
      if (!shownIds.has(node.event.id)) {
        node.group.hidden = true;
        node.group.setAttribute(&quot;display&quot;, &quot;none&quot;);
        return;
      }
      const placed = visible.find(point =&gt; point.event.id === node.event.id);
      node.group.hidden = false;
      node.group.removeAttribute(&quot;display&quot;);
      node.group.setAttribute(&quot;transform&quot;, `translate(${placed.x},${placed.y})`);
      if (Math.hypot(placed.x - placed.anchorX, placed.y - placed.anchorY) &gt; 5) {
        const line = document.createElementNS(ns, &quot;line&quot;);
        line.setAttribute(&quot;class&quot;, &quot;leader&quot;);
        line.setAttribute(&quot;x1&quot;, placed.anchorX);
        line.setAttribute(&quot;y1&quot;, placed.anchorY);
        line.setAttribute(&quot;x2&quot;, placed.x);
        line.setAttribute(&quot;y2&quot;, placed.y);
        leadersLayer.appendChild(line);
      }
    });
  }

  function draw() {
    const spherePath = path(sphere);
    sphereClipPath.setAttribute(&quot;d&quot;, spherePath);
    shadowPath.setAttribute(&quot;d&quot;, spherePath);
    oceanPath.setAttribute(&quot;d&quot;, spherePath);
    graticulePath.setAttribute(&quot;d&quot;, path(graticule));
    countryPaths.forEach(item =&gt; item.element.setAttribute(&quot;d&quot;, path(item.feature) || &quot;&quot;));
    statePaths.forEach(item =&gt; item.element.setAttribute(&quot;d&quot;, path(item.feature) || &quot;&quot;));
    placeMarkers();
  }

  function createMarker(event) {
    const radius = volumeRadius(event.volume);
    const group = document.createElementNS(ns, &quot;g&quot;);
    group.setAttribute(&quot;class&quot;, `event-marker sport-${event.sport}${event.marketPosted ? &quot;&quot; : &quot; market-missing&quot;}`);
    group.dataset.id = event.id;
    group.setAttribute(&quot;aria-label&quot;, `${event.sport} ${event.name}, ${event.city}, ${event.marketPosted ? &quot;price &quot; + priceLabel(event.leader) : &quot;market not posted&quot;}`);

    const hit = document.createElementNS(ns, &quot;circle&quot;);
    hit.setAttribute(&quot;class&quot;, &quot;marker-hit&quot;);
    hit.setAttribute(&quot;r&quot;, String(radius + 9));
    const halo = document.createElementNS(ns, &quot;circle&quot;);
    halo.setAttribute(&quot;class&quot;, &quot;marker-halo&quot;);
    halo.setAttribute(&quot;r&quot;, String(radius + 5));
    const track = document.createElementNS(ns, &quot;circle&quot;);
    track.setAttribute(&quot;class&quot;, &quot;marker-track&quot;);
    track.setAttribute(&quot;r&quot;, String(radius));
    const price = document.createElementNS(ns, &quot;circle&quot;);
    price.setAttribute(&quot;class&quot;, &quot;marker-price&quot;);
    price.setAttribute(&quot;r&quot;, String(radius));
    price.setAttribute(&quot;transform&quot;, &quot;rotate(-90)&quot;);
    price.setAttribute(&quot;stroke-dasharray&quot;, `${2 * Math.PI * radius * event.leader / 100} ${2 * Math.PI * radius}`);
    const core = document.createElementNS(ns, &quot;circle&quot;);
    core.setAttribute(&quot;class&quot;, &quot;marker-core&quot;);
    core.setAttribute(&quot;r&quot;, String(Math.max(9, radius - 4.5)));
    const label = document.createElementNS(ns, &quot;text&quot;);
    label.textContent = event.code;
    group.append(hit, halo, track, price, core, label);
    markersLayer.appendChild(group);

    group.addEventListener(&quot;pointerdown&quot;, pointerEvent =&gt; pointerEvent.stopPropagation());
    group.addEventListener(&quot;click&quot;, () =&gt; selectEvent(event.id, true));
    group.addEventListener(&quot;mouseenter&quot;, () =&gt; showTooltip(event, group));
    group.addEventListener(&quot;mouseleave&quot;, hideTooltip);
    return { event, group, radius };
  }

  function renderPriceList(event) {
    const list = root.querySelector(&quot;.price-list&quot;);
    list.replaceChildren();
    if (!event.marketPosted) {
      const empty = document.createElement(&quot;div&quot;);
      empty.className = &quot;text-small text-muted&quot;;
      empty.textContent = &quot;Market not posted yet · exact ticker is ready&quot;;
      list.appendChild(empty);
      selectedTicker = event.eventTicker;
      return;
    }

    event.prices.forEach((price, index) =&gt; {
      const [name, last, bid, ask, ticker] = price;
      const button = document.createElement(&quot;button&quot;);
      button.type = &quot;button&quot;;
      button.className = `price-row${index === 0 ? &quot; is-selected&quot; : &quot;&quot;}`;
      const spread = bid == null ? &quot;&quot; : `, bid ${priceLabel(bid)}, ask ${priceLabel(ask)}`;
      button.setAttribute(&quot;aria-label&quot;, `${name}, last trade ${priceLabel(last)}${spread}`);
      button.innerHTML = `&lt;span class=&quot;price-label&quot;&gt;&lt;span&gt;${name}&lt;/span&gt;&lt;span class=&quot;price-value&quot;&gt;${priceLabel(last)}&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;price-track&quot;&gt;&lt;span class=&quot;price-fill&quot; style=&quot;width:${Math.max(last, 0.8)}%&quot;&gt;&lt;/span&gt;&lt;/span&gt;`;
      if (bid != null) button.title = `Bid ${priceLabel(bid)} · Ask ${priceLabel(ask)}`;
      button.addEventListener(&quot;click&quot;, () =&gt; {
        list.querySelectorAll(&quot;.price-row&quot;).forEach(row =&gt; row.classList.remove(&quot;is-selected&quot;));
        button.classList.add(&quot;is-selected&quot;);
        selectedTicker = ticker;
        root.querySelector(&quot;.contract-ticker&quot;).textContent = ticker;
        marketLink.href = marketUrl(ticker);
      });
      list.appendChild(button);
    });
    selectedTicker = event.prices[0][4];
  }

  function selectEvent(id, rotateToEvent = false) {
    const event = activeEvents.find(item =&gt; item.id === id);
    if (!event) return;
    selectedId = event.id;
    markerNodes.forEach(node =&gt; node.group.classList.toggle(&quot;is-selected&quot;, node.event.id === selectedId));
    eventSelect.value = event.id;
    detail.dataset.sport = event.sport;
    root.querySelector(&quot;.sport-badge&quot;).textContent = event.sport;
    root.querySelector(&quot;.event-dates&quot;).textContent = event.sport === &quot;MLB&quot; ? `${event.dates} · ${event.status}` : event.dates;
    root.querySelector(&quot;.event-name&quot;).textContent = event.name;
    root.querySelector(&quot;.event-location&quot;).textContent = `${event.venue} · ${event.city}`;
    root.querySelector(&quot;.event-ticker&quot;).textContent = event.eventTicker;
    root.querySelector(&quot;.price-header-label&quot;).textContent = event.sport === &quot;MLB&quot; ? &quot;Kalshi game winner · last trade&quot; : &quot;Kalshi outright winner · last trade&quot;;
    root.querySelector(&quot;.contract-count&quot;).textContent = event.sport === &quot;MLB&quot; ? &quot;2 outcomes&quot; : `${event.contracts} contracts`;
    renderPriceList(event);
    root.querySelector(&quot;.market-meta&quot;).textContent = `${formatVolume(event.volume)} · snapshot Jul 31, 6:18 PM ET`;
    root.querySelector(&quot;.contract-ticker&quot;).textContent = selectedTicker;
    marketLink.href = marketUrl(selectedTicker);
    marketLink.textContent = event.marketPosted ? &quot;Open Kalshi&quot; : &quot;Check Kalshi&quot;;

    if (rotateToEvent) {
      projection.rotate([-event.lon, -event.lat, 0]);
      draw();
    }
  }

  function updateFilterButtons() {
    const allOn = sports.every(sport =&gt; enabledSports.has(sport));
    root.querySelectorAll(&quot;.filter-button&quot;).forEach(button =&gt; {
      const pressed = button.dataset.sport === &quot;ALL&quot; ? allOn : enabledSports.has(button.dataset.sport);
      button.classList.toggle(&quot;is-active&quot;, pressed);
      button.setAttribute(&quot;aria-pressed&quot;, String(pressed));
    });
  }

  function renderEvents() {
    const date = mlb.dates[activeDateIndex];
    const dateEvents = [];
    if (enabledSports.has(&quot;MLB&quot;)) dateEvents.push(...gamesByDate[activeDateIndex].map(unpackMlb));
    dateEvents.push(...activeTourEvents(date).filter(event =&gt; enabledSports.has(event.sport)));
    activeEvents = dateEvents.sort((a, b) =&gt; sportOrder[a.sport] - sportOrder[b.sport] || a.sortKey.localeCompare(b.sortKey));

    markersLayer.replaceChildren();
    leadersLayer.replaceChildren();
    markerNodes = activeEvents.map(createMarker);
    eventSelect.replaceChildren();
    activeEvents.forEach(event =&gt; {
      const option = document.createElement(&quot;option&quot;);
      option.value = event.id;
      option.textContent = `${event.sport} — ${event.name}`;
      eventSelect.appendChild(option);
    });

    const posted = activeEvents.filter(event =&gt; event.marketPosted).length;
    root.querySelector(&quot;.hud-summary&quot;).textContent = `${activeEvents.length} events · ${posted} markets posted`;
    const selectionChanged = !activeEvents.some(event =&gt; event.id === selectedId);
    if (selectionChanged) selectedId = activeEvents[0]?.id || null;
    if (selectedId) {
      selectEvent(selectedId, selectionChanged);
      if (!selectionChanged) draw();
    } else {
      draw();
    }
  }

  function renderDate(index) {
    activeDateIndex = Number(index);
    dateRange.value = String(activeDateIndex);
    dateOutput.textContent = dateLabel.format(new Date(`${mlb.dates[activeDateIndex]}T12:00:00Z`));
    renderEvents();
  }

  function showTooltip(event, group) {
    const market = event.marketPosted ? `${event.prices[0][0]} · ${priceLabel(event.leader)}` : &quot;Not posted&quot;;
    tooltip.dataset.sport = event.sport;
    tooltip.innerHTML = `&lt;div class=&quot;hover-topline text-small&quot;&gt;&lt;span class=&quot;hover-sport&quot;&gt;&lt;span class=&quot;hover-dot&quot;&gt;&lt;/span&gt;${event.sport}&lt;/span&gt;&lt;span class=&quot;hover-price&quot;&gt;${market}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hover-name&quot;&gt;${event.name}&lt;/div&gt;&lt;div class=&quot;hover-location text-small&quot;&gt;${event.venue} · ${event.city}&lt;/div&gt;&lt;div class=&quot;hover-meta text-small&quot;&gt;&lt;span&gt;${event.dates}&lt;/span&gt;&lt;span&gt;${formatVolume(event.volume)}&lt;/span&gt;&lt;/div&gt;`;
    tooltip.hidden = false;
    requestAnimationFrame(() =&gt; {
      const transform = group.transform.baseVal.consolidate();
      if (!transform) return;
      const point = svg.createSVGPoint();
      point.x = transform.matrix.e;
      point.y = transform.matrix.f;
      const screen = point.matrixTransform(svg.getScreenCTM());
      const stageRect = root.querySelector(&quot;.globe-stage&quot;).getBoundingClientRect();
      const box = tooltip.getBoundingClientRect();
      const idealLeft = screen.x - stageRect.left - box.width / 2;
      tooltip.style.left = `${Math.max(4, Math.min(stageRect.width - box.width - 4, idealLeft))}px`;
      tooltip.style.top = `${Math.max(4, screen.y - stageRect.top - box.height - 18)}px`;
    });
  }

  function hideTooltip() {
    tooltip.hidden = true;
  }

  let dragging = false;
  let dragStart = null;
  let startRotation = null;
  svg.addEventListener(&quot;pointerdown&quot;, event =&gt; {
    dragging = true;
    dragStart = [event.clientX, event.clientY];
    startRotation = projection.rotate();
    svg.classList.add(&quot;is-dragging&quot;);
    svg.setPointerCapture(event.pointerId);
    hideTooltip();
  });
  svg.addEventListener(&quot;pointermove&quot;, event =&gt; {
    if (!dragging) return;
    projection.rotate([startRotation[0] + (event.clientX - dragStart[0]) * 0.28, Math.max(-75, Math.min(75, startRotation[1] - (event.clientY - dragStart[1]) * 0.28)), 0]);
    draw();
  });
  function endDrag(event) {
    if (!dragging) return;
    dragging = false;
    svg.classList.remove(&quot;is-dragging&quot;);
    if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
  }
  svg.addEventListener(&quot;pointerup&quot;, endDrag);
  svg.addEventListener(&quot;pointercancel&quot;, endDrag);

  function zoomBy(factor) {
    projection.scale(Math.max(170, Math.min(900, projection.scale() * factor)));
    hideTooltip();
    draw();
  }

  svg.addEventListener(&quot;wheel&quot;, event =&gt; {
    event.preventDefault();
    zoomBy(Math.exp(-event.deltaY * 0.0012));
  }, { passive: false });
  svg.addEventListener(&quot;dblclick&quot;, event =&gt; {
    event.preventDefault();
    zoomBy(1.35);
  });
  root.querySelector(&quot;.zoom-in&quot;).addEventListener(&quot;click&quot;, () =&gt; zoomBy(1.35));
  root.querySelector(&quot;.zoom-out&quot;).addEventListener(&quot;click&quot;, () =&gt; zoomBy(1 / 1.35));

  root.querySelectorAll(&quot;.filter-button&quot;).forEach(button =&gt; button.addEventListener(&quot;click&quot;, () =&gt; {
    const sport = button.dataset.sport;
    if (sport === &quot;ALL&quot;) {
      sports.forEach(item =&gt; enabledSports.add(item));
    } else if (enabledSports.has(sport) &amp;&amp; enabledSports.size &gt; 1) {
      enabledSports.delete(sport);
    } else {
      enabledSports.add(sport);
    }
    updateFilterButtons();
    renderEvents();
  }));
  eventSelect.addEventListener(&quot;change&quot;, event =&gt; selectEvent(event.target.value, true));
  dateRange.addEventListener(&quot;input&quot;, event =&gt; renderDate(event.target.value));
  root.querySelector(&quot;.refresh-markets&quot;).addEventListener(&quot;click&quot;, async () =&gt; {
    if (window.openai?.sendFollowUpMessage) {
      await window.openai.sendFollowUpMessage({
        title: &quot;Refresh global sports odds&quot;,
        prompt: `Refresh MLB schedules and all currently open Kalshi MLB, ATP, WTA, PGA, UEFA Champions League, and international cricket winner markets for ${mlb.dates[activeDateIndex]}. Match every posted event to its official date and venue, then update this unified globe while preserving the date slider, independent sport toggles, top-ten in-frame ranking, map zoom, logarithmic volume sizing, price rings, tickers, and visual design.`
      });
    }
  });

  updateFilterButtons();
  renderDate(0);
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);

      return;
    }

    if (activeTrigger === trigger) {
