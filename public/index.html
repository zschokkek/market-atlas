<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Explore live Kalshi sports, politics, and weather markets on one interactive globe.">
  <meta name="theme-color" content="#0b110e">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="Market Atlas">
  <meta name="apple-mobile-web-app-title" content="Market Atlas">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Market Atlas">
  <meta property="og:description" content="Live sports, politics, and weather markets on one interactive globe.">
  <meta property="og:image" content="/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Market Atlas">
  <meta name="twitter:description" content="Live sports, politics, and weather markets on one interactive globe.">
  <meta name="twitter:image" content="/og.png">
  <title>Market Atlas</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/search.css">
</head>
<body class="integration-body">
  <main class="integration-shell" data-active-category="sports">
    <header class="integration-header">
      <div class="integration-brand" aria-label="Powered by Kalshi">
        <span class="integration-powered">Powered by</span>
        <span class="integration-lockup">
          <svg class="integration-kalshi-mark" viewBox="0 0 34 34" role="img" aria-label="Kalshi">
            <rect x="1" y="1" width="32" height="32" rx="9" fill="#0ac285"></rect>
            <path d="M9 8.5h5v6.4l6.15-6.4h6.35l-7.45 7.55L27 25.5h-6.4l-5.05-6.1L14 21v4.5H9z" fill="#07120d"></path>
          </svg>
          <span class="integration-wordmark">KALSHI</span>
        </span>
      </div>

      <nav class="integration-tabs" role="tablist" aria-label="Market category">
        <button class="integration-tab is-active" id="category-tab-sports" type="button" role="tab" data-category="sports" aria-selected="true" aria-controls="category-view-sports">Sports</button>
        <button class="integration-tab" id="category-tab-politics" type="button" role="tab" data-category="politics" aria-selected="false" aria-controls="category-view-politics" tabindex="-1">Politics</button>
        <button class="integration-tab" id="category-tab-weather" type="button" role="tab" data-category="weather" aria-selected="false" aria-controls="category-view-weather" tabindex="-1">Weather</button>
      </nav>

      <div class="integration-search-shell" data-market-search>
        <label class="integration-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.75"></circle><path d="m16 16 4 4"></path></svg>
          <span class="integration-sr-only">Search</span>
          <input type="search" aria-label="Search markets, teams, and cities" placeholder="Try ‘Dodgers tonight’">
          <kbd>&#8984; K</kbd>
        </label>
        <section class="market-search-panel" aria-label="Market search results" hidden>
          <div class="market-search-context" aria-live="polite"></div>
          <div class="market-search-results" id="integrated-market-search-results" role="listbox"></div>
        </section>
      </div>
    </header>

    <section class="integration-stage" aria-label="Markets globe">
      <section class="category-view is-active" id="category-view-sports" role="tabpanel" aria-labelledby="category-tab-sports" data-category-view="sports">
        <div class="category-loading" role="status"><span class="category-loading-orb" aria-hidden="true"></span><span>Loading sports globe</span></div>
      </section>
      <section class="category-view" id="category-view-politics" role="tabpanel" aria-labelledby="category-tab-politics" data-category-view="politics" aria-hidden="true" inert>
        <div class="category-loading" role="status"><span class="category-loading-orb" aria-hidden="true"></span><span>Preparing politics globe</span></div>
      </section>
      <section class="category-view" id="category-view-weather" role="tabpanel" aria-labelledby="category-tab-weather" data-category-view="weather" aria-hidden="true" inert>
        <div class="category-loading" role="status"><span class="category-loading-orb" aria-hidden="true"></span><span>Preparing weather globe</span></div>
      </section>
    </section>
  </main>

  <script type="module" src="/assets/app.js"></script>
  <script type="module" src="/assets/search.js"></script>
</body>
</html>
